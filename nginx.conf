server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WUD may replace only the backend, giving it a new container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /api/ {
        set $ad_backend employee-be:5000;
        proxy_pass http://$ad_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /admin {
        try_files /admin_login.html =404;
    }

    location = /admin/manage {
        try_files /admin_manage.html =404;
    }

    location = /reset {
        try_files /reset.html =404;
    }

    location = /reset/confirm {
        try_files /reset_confirm.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
