<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .card {
            background: white; border-radius: 12px; padding: 40px;
            width: 100%; max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .header { text-align: center; margin-bottom: 32px; }
        .header .icon { font-size: 48px; margin-bottom: 12px; }
        .header h1 { font-size: 20px; color: #1a1a1a; font-weight: 600; }
        .header p { color: #888; font-size: 13px; margin-top: 6px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 14px; color: #444; margin-bottom: 6px; font-weight: 500; }
        input {
            width: 100%; padding: 10px 14px; border: 1px solid #d9d9d9;
            border-radius: 8px; font-size: 14px; color: #333; outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #1a1a2e; box-shadow: 0 0 0 2px rgba(26,26,46,0.1); }
        #loginBtn {
            width: 100%; padding: 12px; background: #1a1a2e; color: white;
            border: none; border-radius: 8px; font-size: 15px;
            font-weight: 500; cursor: pointer; margin-top: 8px;
        }
        #loginBtn:hover:not(:disabled) { background: #2d2d5e; }
        #loginBtn:disabled { background: #888; cursor: not-allowed; }
        .message { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: none; }
        .message.error { background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322; display: block; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 13px; }
        .footer-link a { color: #888; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="icon">🛡️</div>
        <h1>管理员后台</h1>
        <p>微丰启公司 IT管理系统</p>
    </div>

    <div id="message" class="message"></div>

    <form id="loginForm">
        <div class="form-group">
            <label>管理员账号</label>
            <input type="text" id="username" placeholder="请输入账号">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <button type="button" id="loginBtn" onclick="doLogin()">登 录</button>
    </form>

    <div class="footer-link">
        <a href="/">← 返回注册页</a>
    </div>
</div>
<script>
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// 未登录被踢回时显示提示（/admin?need_login=1）
(function () {
    const msg = document.getElementById('message');
    if (new URLSearchParams(location.search).get('need_login') === '1') {
        msg.textContent = '请先登录';
        msg.className = 'message error';
    }
})();

async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('message');

    if (!username || !password) {
        msg.textContent = '请填写账号和密码';
        msg.className = 'message error';
        return;
    }
    btn.disabled = true; btn.textContent = '登录中...';
    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = '/admin/manage';
        } else {
            msg.textContent = data.message;
            msg.className = 'message error';
            btn.disabled = false; btn.textContent = '登 录';
        }
    } catch(e) {
        msg.textContent = '网络错误';
        msg.className = 'message error';
        btn.disabled = false; btn.textContent = '登 录';
    }
}
</script>
</body>
</html>
